[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "heliostune"
version = "0.6.0.dev0"
description = "Retrieval-first GPU autotuning and evidence-control research platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mottopanikeiku" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2.5",
  "rich>=13.7,<15",
  "zstandard==0.25.0",
]

[project.urls]
Repository = "https://github.com/mottopanikeiku/heliostune"
Issues = "https://github.com/mottopanikeiku/heliostune/issues"
Results = "https://mottopanikeiku.github.io/heliostune/"

[project.optional-dependencies]
gpu = [
  "torch==2.8.0",
  "triton==3.4.0",
]
modal = [
  "modal==1.5.4",
]
dev = [
  "coverage>=7.10,<8",
  "hypothesis>=6.112,<7",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<0.17",
]

[project.scripts]
heliostune = "heliostune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heliostune"]

[tool.hatch.build.targets.sdist]
include = [
  "src/heliostune",
  "tests",
  "typings",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "benchmarks",
  "site",
  "modal_bench.py",
  "scripts",
  ".gitignore",
]

[tool.uv]
build-constraint-dependencies = ["hatchling==1.32.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "typings"
strict = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["heliostune"]
# GPU-only JIT modules are gated by the paid pre-timing correctness check; CPU CI
# cannot import either implementation.
omit = ["src/heliostune/_fusion_gpu.py", "src/heliostune/hopper_kernel.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
