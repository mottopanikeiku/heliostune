[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heliostune"
version = "0.2.0"
description = "Retrieval-anchored Bayesian autotuning across GPU targets"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "mottopanikeiku" }]
dependencies = [
  "numpy>=1.26,<3",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.9,<1",
]
gpu = [
  "modal>=1.5,<2",
  "torch==2.8.0",
  "triton==3.4.0",
]

[project.scripts]
heliostune = "heliostune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heliostune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
