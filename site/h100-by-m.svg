<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Geometric-mean latency over torch by M</title><desc id="chart-desc">Log-scale dot plot of named-workload geometric means for the old, new and union arms on bank 2. The dark vertical line marks parity with torch; lower is faster.</desc><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="sans-serif" font-size="12" fill="#142a33"><circle cx="130" cy="22" r="5" fill="#1261a0"/><text x="140" y="26">Old 36</text><circle cx="240" cy="22" r="5" fill="#b54c00"/><text x="250" y="26">New</text><circle cx="350" cy="22" r="5" fill="#176b67"/><text x="360" y="26">Union</text><line x1="187.5" y1="46" x2="187.5" y2="390" stroke="#142a33"/><text x="187.5" y="406" text-anchor="middle">1.00×</text><line x1="383.3" y1="46" x2="383.3" y2="390" stroke="#c9c0ae"/><text x="383.3" y="406" text-anchor="middle">1.25×</text><line x1="543.2" y1="46" x2="543.2" y2="390" stroke="#c9c0ae"/><text x="543.2" y="406" text-anchor="middle">1.50×</text><line x1="678.5" y1="46" x2="678.5" y2="390" stroke="#c9c0ae"/><text x="678.5" y="406" text-anchor="middle">1.75×</text><text x="12" y="78">M = 1</text><circle cx="628.6" cy="62" r="5" fill="#1261a0"><title>Old 36, M = 1: 1.653× torch</title></circle><circle cx="225.8" cy="74" r="5" fill="#b54c00"><title>New, M = 1: 1.045× torch</title></circle><circle cx="225.8" cy="86" r="5" fill="#176b67"><title>Union, M = 1: 1.045× torch</title></circle><text x="12" y="132">M = 7</text><circle cx="627.9" cy="116" r="5" fill="#1261a0"><title>Old 36, M = 7: 1.652× torch</title></circle><circle cx="238.1" cy="128" r="5" fill="#b54c00"><title>New, M = 7: 1.059× torch</title></circle><circle cx="238.1" cy="140" r="5" fill="#176b67"><title>Union, M = 7: 1.059× torch</title></circle><text x="12" y="186">M = 31</text><circle cx="640.6" cy="170" r="5" fill="#1261a0"><title>Old 36, M = 31: 1.676× torch</title></circle><circle cx="280.3" cy="182" r="5" fill="#b54c00"><title>New, M = 31: 1.112× torch</title></circle><circle cx="280.3" cy="194" r="5" fill="#176b67"><title>Union, M = 31: 1.112× torch</title></circle><text x="12" y="240">M = 96</text><circle cx="640.3" cy="224" r="5" fill="#1261a0"><title>Old 36, M = 96: 1.675× torch</title></circle><circle cx="468.6" cy="236" r="5" fill="#b54c00"><title>New, M = 96: 1.378× torch</title></circle><circle cx="468.6" cy="248" r="5" fill="#176b67"><title>Union, M = 96: 1.378× torch</title></circle><text x="12" y="294">M = 257</text><circle cx="605.1" cy="278" r="5" fill="#1261a0"><title>Old 36, M = 257: 1.610× torch</title></circle><circle cx="465.6" cy="290" r="5" fill="#b54c00"><title>New, M = 257: 1.373× torch</title></circle><circle cx="461.0" cy="302" r="5" fill="#176b67"><title>Union, M = 257: 1.366× torch</title></circle><text x="12" y="348">M = 1024</text><circle cx="483.5" cy="332" r="5" fill="#1261a0"><title>Old 36, M = 1024: 1.401× torch</title></circle><circle cx="291.5" cy="344" r="5" fill="#b54c00"><title>New, M = 1024: 1.126× torch</title></circle><circle cx="291.5" cy="356" r="5" fill="#176b67"><title>Union, M = 1024: 1.126× torch</title></circle></g></svg>
