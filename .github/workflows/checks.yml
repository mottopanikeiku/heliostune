name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typing:
    name: Typing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra modal
      - name: Install hash-pinned Torch annotations without CUDA dependencies
        run: |
          uv pip install --python .venv/bin/python --no-deps \
            "https://files.pythonhosted.org/packages/5a/63/4fdc45a0304536e75a5e1b1bbfb1b56dd0e2743c48ee83ca729f7ce44162/torch-2.8.0-cp311-cp311-manylinux_2_28_x86_64.whl#sha256=c12fa219f51a933d5f80eeb3a7a5d0cbe9168c0a14bbb4055f1979431660879b"
      - run: uv run mypy src/heliostune modal_bench.py modal_precision_probe.py scripts

  coverage-fast:
    name: Coverage Fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Cover fast behavioral tests
        run: |
          uv run coverage run --branch --data-file=.coverage.fast -m pytest \
            --ignore=tests/test_selection.py \
            --ignore=tests/test_research_artifacts.py \
            --ignore=tests/test_v2_addendum.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-fast
          path: .coverage.fast
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-evidence:
    name: Coverage Evidence Core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Cover slow frozen-selection tests
        run: |
          uv run coverage run --branch --data-file=.coverage.evidence -m pytest \
            tests/test_selection.py \
            tests/test_v2_addendum.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-evidence
          path: .coverage.evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-catalog:
    name: Coverage Evidence Catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Cover slow research-artifact tests
        run: |
          uv run coverage run --branch --data-file=.coverage.catalog -m pytest \
            tests/test_research_artifacts.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-catalog
          path: .coverage.catalog
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: [coverage-fast, coverage-evidence, coverage-catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - run: uv run coverage combine coverage-data
      - run: uv run coverage report

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest
