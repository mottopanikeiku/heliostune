name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv lock --check
      - run: uv build --out-dir dist
      - run: |
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
          uv venv --clear package-env --python 3.11
          uv pip install --python package-env/bin/python dist/*.whl
          package-env/bin/python -c "import heliostune, importlib.metadata as m; assert heliostune.__version__ == m.version('heliostune')"
          package-env/bin/heliostune --help
          uv venv --clear sdist-env --python 3.11
          uv pip install --python sdist-env/bin/python dist/*.tar.gz
          sdist-env/bin/python -c "import heliostune, importlib.metadata as m; assert heliostune.__version__ == m.version('heliostune')"
          sdist-env/bin/heliostune --help

  evidence:
    name: Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Regenerate the published H100 summary
        run: |
          uv run heliostune compare-multisource \
            benchmarks/data/parhelion-v2-measurements.jsonl.zst \
            --sources L4,A10,T4 --target H100 --max-budget 8 --seeds 30 \
            --k 16 --temperature 2.0 --transfer-strength 0.0 \
            --retrieval-k 8 --retrieval-temperature 0.2 \
            --pooled-transfer-strength 0.0 --primary-comparator torch \
            --protocol-role final \
            --release-provenance benchmarks/parhelion-h100-release-provenance.json \
            --output "${RUNNER_TEMP}/h100-final-summary.json"
          cmp "${RUNNER_TEMP}/h100-final-summary.json" benchmarks/results/parhelion-h100-final.json
      - run: uv run heliostune verify-catalog benchmarks/research-artifact-manifest.json
      - run: uv run python scripts/build_parhelion_v2_addendum.py --check
      - run: uv run python scripts/publish_hopper_engineering_result.py --check
      - run: uv run python scripts/publish_fusion_remote_results.py --check
